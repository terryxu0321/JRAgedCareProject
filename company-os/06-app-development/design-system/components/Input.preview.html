<!-- @dsCard group="Inputs" height=230 subtitle="default · error" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Input — preview</title>
<style>
	body { margin: 0; padding: var(--spacing-md); background: var(--canvas); color: var(--ink); font-family: var(--font-text); }
	.stack { display: grid; gap: var(--spacing-md); max-width: 420px; }
	.field { display: grid; gap: var(--spacing-xs); }
	label { font: 600 14px/1.29 var(--font-text); letter-spacing: -0.224px; }
	input { font: 400 17px/1.47 var(--font-text); letter-spacing: -0.374px; color: var(--ink); background: var(--canvas); min-height: var(--size-control-height); padding: 12px 16px; border: 1px solid var(--border-input); border-radius: var(--rounded-sm); box-sizing: border-box; width: 100%; }
	input:focus-visible { outline: 2px solid var(--primary-focus); outline-offset: 2px; }
	.error input { border: 2px solid var(--status-error); }
	.msg { font: 400 14px/1.43 var(--font-text); color: var(--status-error); }
</style>
</head>
<body>
<div class="stack">
	<div class="field">
		<label for="room">Room</label>
		<input id="room" value="12">
	</div>
	<div class="field error">
		<label for="time">Time of event</label>
		<input id="time" value="7.42" aria-invalid="true" aria-describedby="time-msg">
		<div class="msg" id="time-msg">⚠ Use 24-hour time, for example 07:42.</div>
	</div>
</div>
</body>
</html>
