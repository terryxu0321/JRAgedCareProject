<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DateTimeInput — preview</title>
<style>
	body { margin: 0; padding: var(--spacing-md); background: var(--canvas); color: var(--ink); font-family: var(--font-text); }
	.row { display: flex; flex-wrap: wrap; gap: var(--spacing-sm); align-items: end; }
	.field { display: grid; gap: var(--spacing-xs); }
	label { font: 600 14px/1.29 var(--font-text); letter-spacing: -0.224px; }
	.box { min-height: var(--size-control-height); padding: 12px 16px; border: 1px solid var(--border-input); border-radius: var(--rounded-sm); background: var(--canvas); font: 400 17px/1.47 var(--font-text); letter-spacing: -0.374px; font-variant-numeric: tabular-nums; box-sizing: border-box; min-width: 140px; }
	.now { font: 600 17px/1.18 var(--font-text); min-height: var(--size-control-height); padding: 12px 24px; border-radius: var(--rounded-pill); border: 1px solid var(--primary); background: transparent; color: var(--primary); cursor: pointer; }
	.now:focus-visible { outline: 2px solid var(--primary-focus); outline-offset: 2px; }
</style>
</head>
<body>
<div class="row">
	<div class="field"><label>Date</label><div class="box">11/10/2026</div></div>
	<div class="field"><label>Time of event</label><div class="box">06:10</div></div>
	<button class="now" type="button">Now</button>
</div>
</body>
</html>
