<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TextLink — preview</title>
<style>
	body { margin: 0; font-family: var(--font-text); font-size: 17px; line-height: 1.47; letter-spacing: -0.374px; }
	.pane { padding: var(--spacing-md); }
	.light { background: var(--canvas); color: var(--ink); }
	.dark { background: var(--surface-tile-1); color: var(--on-dark); }
	p { margin: 0; }
	a { text-decoration: underline; text-underline-offset: 3px; }
	a:focus-visible { outline: 2px solid var(--primary-focus); outline-offset: 2px; }
	.light a { color: var(--primary); }
	.dark a { color: var(--primary-on-dark); }
</style>
</head>
<body>
<div class="pane light"><p>Two drafts are waiting. <a href="#">View shift summary</a></p></div>
<div class="pane dark"><p>Night theme. <a href="#">View shift summary</a></p></div>
</body>
</html>
