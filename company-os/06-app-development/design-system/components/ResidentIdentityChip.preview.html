<!-- @dsCard group="Safety-critical" height=210 subtitle="default · same-name warning" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ResidentIdentityChip — preview</title>
<style>
	body { margin: 0; padding: var(--spacing-md); background: var(--canvas); color: var(--ink); font-family: var(--font-text); }
	.stack { display: grid; gap: var(--spacing-sm); max-width: 420px; }
	.chip { display: grid; grid-template-columns: 40px 1fr; gap: 4px var(--spacing-sm); align-items: center; background: var(--canvas-parchment); border-radius: var(--rounded-lg); padding: var(--spacing-sm) var(--spacing-md); }
	.avatar { width: 40px; height: 40px; border-radius: var(--rounded-full); background: var(--ink); color: var(--on-dark); display: grid; place-items: center; font: 600 14px/1 var(--font-text); grid-row: span 2; }
	.name { font: 600 17px/1.24 var(--font-text); letter-spacing: -0.374px; }
	.id { font: 400 17px/1.47 var(--font-text); letter-spacing: -0.374px; color: var(--ink-muted); }
	.warn { grid-column: 1 / -1; font: 600 14px/1.29 var(--font-text); letter-spacing: -0.224px; color: var(--ink); background: var(--status-attention-bg); border-radius: var(--rounded-sm); padding: var(--spacing-xs) var(--spacing-sm); }
	.warn span { color: var(--status-attention); }
</style>
</head>
<body>
<div class="stack">
	<div class="chip"><div class="avatar" aria-hidden="true">SA</div><div class="name">Sample Resident A</div><div class="id">Room 12 (sample)</div></div>
	<div class="chip"><div class="avatar" aria-hidden="true">SB</div><div class="name">Sample Resident B</div><div class="id">Room 14 (sample)</div>
		<div class="warn"><span aria-hidden="true">⚠</span> Another resident has a similar name. Check the room number.</div></div>
</div>
</body>
</html>
