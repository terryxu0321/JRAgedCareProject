<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DataTable — preview</title>
<style>
	body { margin: 0; padding: var(--spacing-md); background: var(--canvas); color: var(--ink); font-family: var(--font-text); }
	.scroll { overflow-x: auto; }
	table { width: 100%; min-width: 520px; border-collapse: collapse; }
	th { text-align: left; font: 600 14px/1.29 var(--font-text); letter-spacing: -0.224px; color: var(--ink-muted); padding: var(--spacing-xs) var(--spacing-sm); border-bottom: 1px solid var(--hairline); }
	td { font: 400 17px/1.47 var(--font-text); letter-spacing: -0.374px; padding: 0 var(--spacing-sm); height: 48px; border-bottom: 1px solid var(--hairline); }
	.num { text-align: right; font-variant-numeric: tabular-nums; }
	.tag { padding: 4px 12px; border-radius: var(--rounded-pill); font: 600 14px/1.29 var(--font-text); background: var(--status-confirmed-bg); white-space: nowrap; }
	.tag.d { background: var(--status-draft-bg); }
	.foot { display: flex; align-items: center; justify-content: space-between; gap: var(--spacing-sm); flex-wrap: wrap; margin-top: var(--spacing-sm); }
	.count { font: 400 14px/1.43 var(--font-text); color: var(--ink-muted); }
	.pager { display: flex; gap: var(--spacing-xs); }
	.btn { font: 600 17px/1.18 var(--font-text); min-height: 40px; padding: 8px 20px; border-radius: var(--rounded-pill); border: 1px solid var(--primary); background: transparent; color: var(--primary); cursor: pointer; }
	.btn:disabled { color: var(--ink-muted); border-color: var(--border-input); cursor: default; }
	:focus-visible { outline: 2px solid var(--primary-focus); outline-offset: 2px; }
</style>
</head>
<body>
<div class="scroll">
	<table>
		<thead><tr><th>Resident</th><th>Room</th><th class="num">Notes</th><th>Status</th></tr></thead>
		<tbody>
			<tr><td>Sample Resident A</td><td>12</td><td class="num">3</td><td><span class="tag d">AI draft</span></td></tr>
			<tr><td>Sample Resident B</td><td>14</td><td class="num">12</td><td><span class="tag">✓ Confirmed</span></td></tr>
			<tr><td>Sample Resident C</td><td>15</td><td class="num">0</td><td><span class="tag">✓ Confirmed</span></td></tr>
		</tbody>
	</table>
</div>
<div class="foot"><span class="count">Showing 1–3 of 3 (sample data)</span><div class="pager"><button class="btn" type="button" disabled>Previous</button><button class="btn" type="button" disabled>Next</button></div></div>
</body>
</html>
