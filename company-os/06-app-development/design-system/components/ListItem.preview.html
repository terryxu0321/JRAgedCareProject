<!-- @dsCard group="Data display" height=220 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ListItem — preview</title>
<style>
	body { margin: 0; background: var(--canvas); color: var(--ink); font-family: var(--font-text); }
	ul { list-style: none; margin: 0; padding: 0; }
	li a { display: flex; align-items: center; gap: var(--spacing-sm); min-height: 56px; padding: 12px var(--spacing-md); color: inherit; text-decoration: none; }
	li + li { border-top: 1px solid var(--hairline); margin-left: var(--spacing-md); }
	li + li a { padding-left: 0; }
	.text { flex: 1; min-width: 0; display: grid; }
	.t { font: 400 17px/1.47 var(--font-text); letter-spacing: -0.374px; }
	.s { font: 400 14px/1.43 var(--font-text); color: var(--ink-muted); }
	.tag { padding: 4px 12px; border-radius: var(--rounded-pill); font: 600 14px/1.29 var(--font-text); background: var(--status-draft-bg); }
	.tag.ok { background: var(--status-confirmed-bg); }
	.chev { color: var(--ink-muted); font-size: 20px; }
	a:focus-visible { outline: 2px solid var(--primary-focus); outline-offset: -2px; }
</style>
</head>
<body>
<ul>
	<li><a href="#"><span class="text"><span class="t">Sample Resident A</span><span class="s">Room 12 · 2 notes this shift</span></span><span class="tag">AI draft</span><span class="chev" aria-hidden="true">›</span></a></li>
	<li><a href="#"><span class="text"><span class="t">Sample Resident B</span><span class="s">Room 14 · 1 note this shift</span></span><span class="tag ok">✓ Confirmed</span><span class="chev" aria-hidden="true">›</span></a></li>
	<li><a href="#"><span class="text"><span class="t">Sample Resident C</span><span class="s">Room 15 · no notes yet</span></span><span class="chev" aria-hidden="true">›</span></a></li>
</ul>
</body>
</html>
