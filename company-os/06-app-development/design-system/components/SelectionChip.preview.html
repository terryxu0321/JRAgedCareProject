<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SelectionChip — preview</title>
<style>
	body { margin: 0; padding: var(--spacing-md); background: var(--canvas); color: var(--ink); font-family: var(--font-text); }
	.row { display: flex; flex-wrap: wrap; gap: var(--spacing-xs); }
	.chip { font: 400 14px/1.43 var(--font-text); letter-spacing: -0.224px; color: var(--ink); background: var(--canvas); min-height: var(--size-control-height); padding: 12px 16px; border: 1px solid var(--border-input); border-radius: var(--rounded-pill); cursor: pointer; }
	.chip[aria-pressed="true"] { border: 2px solid var(--primary-focus); padding: 11px 15px; font-weight: 600; }
	.chip:focus-visible { outline: 2px solid var(--primary-focus); outline-offset: 2px; }
</style>
</head>
<body>
<div class="row" role="group" aria-label="Filter drafts">
	<button class="chip" type="button" aria-pressed="true">✓ Needs review</button>
	<button class="chip" type="button" aria-pressed="false">Confirmed</button>
	<button class="chip" type="button" aria-pressed="false">This shift</button>
</div>
</body>
</html>
