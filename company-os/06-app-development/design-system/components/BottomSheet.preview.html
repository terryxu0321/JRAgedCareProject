<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BottomSheet — preview</title>
<style>
	body { margin: 0; font-family: var(--font-text); background: var(--canvas); }
	.stage { min-height: 330px; display: flex; flex-direction: column; justify-content: flex-end; background: var(--scrim); }
	.sheet { background: var(--canvas); color: var(--ink); border-radius: var(--rounded-lg) var(--rounded-lg) 0 0; padding: var(--spacing-xs) var(--spacing-md) var(--spacing-md); }
	.grab { width: 36px; height: 5px; border-radius: var(--rounded-pill); background: var(--border-input); margin: 0 auto var(--spacing-sm); }
	.head { display: flex; justify-content: space-between; align-items: center; }
	h2 { margin: 0; font: 600 21px/1.19 var(--font-display); letter-spacing: 0.231px; }
	a { color: var(--primary); font: 400 17px/1.47 var(--font-text); padding: 12px 4px; }
	ul { list-style: none; margin: var(--spacing-xs) 0 0; padding: 0; }
	li { min-height: var(--size-control-height); display: flex; align-items: center; border-bottom: 1px solid var(--hairline); font: 400 17px/1.47 var(--font-text); letter-spacing: -0.374px; }
	li:last-child { border-bottom: 0; }
	:focus-visible { outline: 2px solid var(--primary-focus); outline-offset: 2px; }
</style>
</head>
<body>
<div class="stage">
	<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="t">
		<div class="grab" aria-hidden="true"></div>
		<div class="head"><h2 id="t">Move to</h2><a href="#">Done</a></div>
		<ul>
			<li>To review</li>
			<li>Confirmed</li>
			<li>Needs a second check</li>
		</ul>
	</div>
</div>
</body>
</html>
