<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CareKind Design System</title>
<style>
	html, body { margin: 0; height: 100%; }
	body { background: var(--canvas); color: var(--ink); font-family: var(--font-display); overflow: hidden; }
	.cover { position: relative; height: 288px; overflow: hidden; }
	.band { position: absolute; top: 0; left: 0; width: 960px; height: 96px; }
	.band svg { display: block; width: 960px; height: 96px; }
	.tile { fill: var(--surface-tile-1); }
	.brand { fill: var(--primary); }
	.pill-on-dark { fill: var(--primary); rx: var(--rounded-sm); }
	.pill-on-brand { fill: var(--on-primary); rx: var(--rounded-sm); }
	.words { position: absolute; left: var(--spacing-lg); right: var(--spacing-lg); bottom: var(--spacing-lg); }
	.name { margin: 0; font-size: 64px; line-height: .95; font-weight: 600; letter-spacing: -0.28px; color: var(--ink); white-space: nowrap; }
	.tag { margin: var(--spacing-xs) 0 0 2px; font: 400 14px/20px var(--font-text); color: var(--ink-muted); max-width: 440px; }
</style>
</head>
<body>
<div class="cover">
<div class="band" aria-hidden="true">
<svg viewBox="0 0 960 96" width="960" height="96">
<!--
  blocks      surface-tile-1 360×96 and 288×96 bleeding off the right edge (the near-black tile) · primary 216×96 (Action Blue, the only accent) · the white ground between them is the light tile — ≈ 31% of 960×288
  arrangement a strip of unequal full-bleed bands with square corners (rounded-none): light ↔ dark alternation, the colour change is the divider
  pattern     pills, from "rounded-pill = this is an action": blue pills sit on the dark tiles the way pill CTAs do, white pills cut into the blue tile; 16px tall at a spacing-lg pitch
  scales      band height spacing-xxl×2; gaps spacing-xxl; pill height spacing-md, rx rounded-sm (half of 16); pill widths spacing-lg multiples
-->
<rect class="tile" x="0" y="0" width="360" height="96"/>
<rect class="brand" x="408" y="0" width="216" height="96"/>
<rect class="tile" x="672" y="0" width="288" height="96"/>
<rect class="pill-on-dark" x="24" y="56" width="96" height="16" rx="8"/>
<rect class="pill-on-dark" x="144" y="56" width="72" height="16" rx="8"/>
<rect class="pill-on-dark" x="240" y="56" width="48" height="16" rx="8"/>
<rect class="pill-on-dark" x="24" y="24" width="48" height="16" rx="8"/>
<rect class="pill-on-brand" x="432" y="24" width="120" height="16" rx="8"/>
<rect class="pill-on-brand" x="432" y="56" width="72" height="16" rx="8"/>
<rect class="pill-on-brand" x="528" y="56" width="72" height="16" rx="8"/>
<rect class="pill-on-dark" x="696" y="40" width="144" height="16" rx="8"/>
<rect class="pill-on-dark" x="864" y="40" width="72" height="16" rx="8"/>
</svg>
</div>
<div class="words">
<h1 class="name">CareKind Design System</h1>
<p class="tag">界面隐身，记录做主。</p>
</div>
</div>
</body>
</html>
